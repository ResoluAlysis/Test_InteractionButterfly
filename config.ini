# ============================================
# 外置配置
#  放在 exe 同级目录（编辑器里放项目根目录）
#  改完在游戏里按 F5 热重载, 不用重启~
#
#  语法：key: value     !!!( 冒号必须是英文 : )!!!
#  y可用 # 或 ; 开头写注释...
#  缺项 → 使用游戏内置的默认值, 不会报错
#  值写错 → 使用游戏内置的默认值, Console 警告并忽略该项
# ============================================

[App]
# 目标帧率 (-1 = 不限, 开启垂直同步时该项无效)
targetFrameRate: 60
# 是否显示系统鼠标指针 (1显示/0隐藏)
showCursor: 0
# Logo 停留时长（秒）
logoHoldSeconds: 2
# Logo 占屏幕的比例 (0.1 ~ 1, 1 = 铺满短边，0.55 = 居中不到六成)
logoScreenFraction: 0.55
# Logo的渐入 / 渐出时长（秒）0 = 瞬间
logoFadeInSeconds: 0.6
logoFadeOutSeconds: 0.6

# 找不到 Logo 图片时的等待（秒）。避免直接闪进主场景
logoMissingHoldSeconds: 0.8

# 图片路径（相对 exe 同级目录）
logoDir: Logo
logoName: logo

# ---------- 授权显示 ----------
# 右下角角标。0 = 不显示（推荐，观众看不到）
licenseBadge: 0
# 剩余多少天开始预警
licenseWarnDays: 30

# ============================================

[Window] #下面是修改游戏窗口参数的...

# 无边框（1启用/0禁用, 现场大屏务必启用）
borderless: 1
# 窗口置顶 (1启用/0禁用, 危险功能! 会让游戏强制显示在所有窗口之上, 会遮住所有界面)
topmost: 0
# 自定义位置和尺寸 (1启用/0禁用, 不启用则自动适配屏幕大小)
useCustomSize: 1
# 窗口的起点位置 (左上角为坐标原点0,0, 若设置为1920,1080则对应1080P屏幕的右下角)
posX: 0
posY: 0
# 窗口尺寸（宽 x 高）
width: 3440
height: 1440
# 尺寸超过显示器时是否裁到屏幕内（如果使用大屏拼接装置请设为 0）
clampToScreen: 0
# ============================================

[Background] #下面是修改背景参数的...

# 背景音乐音量
musicVolume: 0.6
# 使用背景音乐 (1启用 / 0关闭)
useMusic: 1
# 背景-使用图片 (1启用 / 0关闭)
useImage: 1
# 背景-使用视频 (1启用 / 0关闭, 注意: 视频会盖在图片背景上...)
useVideo: 0
# 使用视频的声音? (1启用 / 0视频静音)
useVideoAudio = 0
# 使用视频声音时静音背景音乐? (1静音背景音乐 / 0两个声音叠在一起)
muteMusicWhenVideoAudio = 1
# ============================================

[PointerTrail]  #下面是修改交互拖尾参数的...

# 拖尾整体缩放系数（1 = 原始大小, 最终大小 = scaleRange 的随机值 × trailScale)
trailScale: 1
# 每个拖尾的间隔距离
spacing: 0.25
# 拖尾的位置抖动 (0为严格沿轨迹生成)
positionJitter: 0.2
# 性能保护: 一帧最多创建多少拖尾物体 (防止快速交互时瞬间生成过多而导致卡顿)
maxPointsPerFrame: 8
# 性能保护: 两个不连续的交互点超过这个距离则断开拖尾
maxSegmentLength: 3

# ============================================

[Flock] #下面是修改蝴蝶群体参数的...

# 场上维持的蝴蝶数量
count: 60
# 分帧：每只蝴蝶每 N 帧思考一次（越大越省性能，越小动作越顺滑）
divisor: 3
# 生成点：在屏幕外这么远处生成 (可以实现蝴蝶飞入屏幕的效果)
spawnDistance: 2
# 回收点：当蝴蝶飞出屏幕这么远时自动回收（必须 > spawnDistance, 不过写错了也有代码兜底...）
recycleMargin: 4
# 当场上蝴蝶数量不足时多少秒补 1 只?
respawnInterval: 0.15
# 开局一次性生成（1一次性/0逐一生成）
spawnAllAtStart: 1
# PC 上用鼠标模拟触摸（现场部署建议 0）
simulateMouseForDebug: 1
# ============================================

[Agent] #下面是修改单只蝴蝶的参数...

# 相对锚点游荡盒 (意思是蝴蝶会在自身这个范围中选点游荡)
boxX: 10
boxY: 8
arriveDistance: 1
# 随机速度区间（格式:  最小值,最大值; 三个不同的速度分别用在蝴蝶不同的状态上）
speedSlow: 0.2, 0.5
speedMedium: 0.6, 1.2
speedFast: 2.0, 3.5
# 蝴蝶体积系数（1 = 原始大小）
sizeScale: 1
# 每只蝴蝶的体积随机浮动（±比例，0 = 不随机）
sizeJitter: 0.15
# 假深度 (这个是让蝴蝶随着运动放大缩小的...一般不用动)
useFakeDepth: 1
worldBottom: -8
worldTop: 8
nearScale: 1.2
farScale: 0.7
# ============================================

[Interest]  #下面是修改兴趣点的参数...(兴趣点是让蝴蝶聚集的点)

# 产生兴趣点的总开关 (1启用/0关闭)
enablePointerInterest:1
# 交互点静止多久产生兴趣点 (单位: 秒)
holdTime: 3
# 移动距离小于该值时判定为静止
stillRadius: 0.15
# 移动后兴趣点存活多久
afterReleaseLifetime: 0.5
# 兴趣点的最长寿命（意思是产生兴趣点后, 在未移动的状态下兴趣点能存在多久, 0 = 不过期）
maxHoldLifetime: 8
# 吸引蝴蝶的半径 / 蝴蝶在兴趣点附近游荡的半径
attractRadius: 6
wanderRadius: 2.5
# ============================================

[GestureInput] # 下面是修改交互"惊扰"效果的...

# 移动距离超过这么多后触发一次范围惊扰
moveThreshold = 0.15
# 惊扰的最小范围 (分大小是因为交互有 "推动蝴蝶" 的效果, 在最小范围中的推动效果最强)
sweepRadius = 0.6
# 惊扰的最大范围
panicRadius = 1.6


# ============================================

[RestSpot] # 下面是蝴蝶停下栖息的参数 (前提是场景内布置有栖息点, 否则不会有栖息效果)
# 目前场景里是没有栖息点的...

# 栖息停留时长（0 = 不轮换）
restDuration: 8
# 每个栖息点最多停留多少只蝴蝶
maxOccupants: 2
# ============================================

[Play] # 下面是蝴蝶之间追逐/打转的嬉戏参数...

# 每秒触发嬉戏的概率
checkChancePerSecond: 0.08
# 公转半径 / 玩耍速度 (若低于0时将默认调整为0.1)
orbitRadius: 1.6
playSpeed: 1.6
# ============================================

[Audio] # 下面是设置游戏音效的...

# 全局同时能有多少个音效播放 (防止一次性播放大量音频导致破音)
maxConcurrent:4
# 每秒触发蝴蝶 滑翔/振翅音效 的概率 (每只蝴蝶都会独立判定, 所以在有大量蝴蝶时可能会很吵...)
cruiseChance: 0.05
dashChance: 0.12
# 蝴蝶受惊时发出音效的概率
fleeChance: 0.8
# ============================================
